spring.datasource.url=jdbc:mysql://localhost:3306/db_tabloncitos?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Configuración JPA / Hibernate (Evitamos que borre o cree tablas a ciegas)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Activamos la ejecución automática de scripts SQL iniciales al arrancar
spring.sql.init.mode=always
server.port=8083